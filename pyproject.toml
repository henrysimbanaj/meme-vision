[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memevision"
version = "0.1.0"
description = "Reconocimiento de imitaciones de memes de michis con visión artificial"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",  # la trae mediapipe; no instalar opencv-python a la vez
    "mediapipe>=1.0.1",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pillow>=10",      # texto con tildes en la UI (OpenCV no las dibuja)
    "matplotlib>=3.8", # trae la fuente DejaVu Sans y dibuja la matriz de confusión
    "miniaudio>=1.12", # decodifica MP3 multiplataforma
    "sounddevice>=0.5", # salida de audio multiplataforma
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: usa MediaPipe o modelos reales (más lento)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PTH"]
